<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .form-card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }

      input[type="text"] {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 1rem;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="form-card">
      <h1>Update Your Location!</h1>
      <form method="post" action="/">
        <label for="email">Email</label>
        <input
          type="text"
          id="email"
          name="email"
          placeholder="Enter your Dimagi email"
          required
        />

        <label for="location">Location</label>
        <input
          type="text"
          id="location"
          name="location"
          placeholder="Enter your city or address"
          required
        />
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
