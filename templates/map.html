<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Locations Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; }
      .container { max-width: 1100px; margin: 2rem auto; padding: 1rem; }
      .card { background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 1rem; }
      .header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
      .actions { margin-left: auto; }
      .btn {
        display: inline-block;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-weight: bold;
      }
      .btn:hover { background: #1d4ed8; }
      #map { height: 600px; border-radius: 12px; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <h1>Where Is Dimagi?</h1>
          <div class="actions">
            <a class="btn" href="/remote-location-form/">Submit a new location</a>
            <a class="btn" href="/normalized-data/">View normalized data</a>
          </div>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      const locations = {{ locations|safe }};
      const map = L.map('map').setView([20, 0], 2);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      locations.filter(item => item.latitude && item.longitude).forEach(item => {
        const marker = L.marker([item.latitude, item.longitude]).addTo(map);
        marker.bindPopup(`<strong>${item.email}</strong><br>${item.location}`);
      });
    </script>
  </body>
</html>
